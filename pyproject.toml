[project]
name = "agent-telemetry"
version = "0.1.0"
description = "Retained MQTT bridge for CodexBar usage telemetry"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
  "paho-mqtt>=2.1,<3",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
